name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install openmim
          mim install mmcv
          pip install mmdet mmengine
          pip install numpy pillow scipy matplotlib pytest
          pip install -e .
      - name: Run tests
        run: |
          python -c "import torch, mmdet, mmcv, mmengine; print('torch', torch.__version__, 'mmdet', mmdet.__version__)"
          pytest -q tests/
