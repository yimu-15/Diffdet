[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffdet"
version = "0.1.0"
description = "DiffDet: Foggy Object Detection through Lightweight Feature-Space Denoising"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Zhang Yimu" }]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "pillow",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
mmdet = ["mmdet>=3.0", "mmcv>=2.0", "mmengine>=0.8"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["diffdet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
